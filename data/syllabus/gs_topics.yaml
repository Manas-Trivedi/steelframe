# Topic taxonomy for the General Studies papers.
#
# Built by the project from the UPSC syllabus in the Civil Services Examination
# 2026 notification, Section III (Syllabi), read on 30 October 2026:
#   https://www.upsc.gov.in/sites/default/files/Notif-CSP-2026-Engl-060226Rev.pdf
# Topic names are our own short wording, not copied from the notification.
# One topic per syllabus line, so a question can be tagged to the line it tests.
#
# Fields
#   id      stable key used in tags
#   paper   where the syllabus line sits: GS1 to GS4 (Mains), or PRE (Prelims-led)
#   name    short name
#   covers  what the topic includes, in our words
#
# Ids never change once published. Add new ids. Never reuse old ones.
#
# Tags also carry a separate flag that is not part of this list:
#   ca  yes if answering needs recent news (roughly the last 18 months), no if it is static knowledge

