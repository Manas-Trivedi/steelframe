# Daily run: fetch, write, check, publish, build the site, audit. Does nothing until the maintainer turns it on.
# To turn on: set the repository variable PIPELINE_ENABLED to "true" and add the secrets GEMINI_API_KEY
# and GROQ_API_KEY. See docs/app/STACK.md and docs/operations/CORRECTIONS.md.
name: daily
on:
  schedule:
    - cron: "30 0 * * *"   # 06:00 India time
  workflow_dispatch:
    inputs:
      stage:
        description: "daily = the whole run. triage = only score unseen items. backfill = write and publish archive issues (run triage first)"
        type: choice
        options: [daily, triage, backfill]
        default: daily
      limit:
        description: "triage only: how many unseen items to score, newest first, 25 per model call"
        type: number
        default: 200
      count:
        description: "backfill only: most issues to decide in this run (the daily and monthly caps in config/gate.json still apply)"
        type: number
        default: 10

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false   # two runs at once would write the same database

jobs:
  run:
    if: ${{ vars.PIPELINE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore the database from the state branch
        run: |
          mkdir -p data/raw
          if git ls-remote --exit-code --heads origin state >/dev/null 2>&1; then
            git fetch origin state
            git show origin/state:scout.sqlite > data/raw/scout.sqlite
            git show origin/state:quota.sqlite > data/raw/quota.sqlite || true
            python3 -c "import sqlite3; sqlite3.connect('data/raw/scout.sqlite').execute('select count(*) from sqlite_master')"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Tests
        run: python3 -m unittest discover -s tests -t .
      - name: Daily run
        id: daily
        if: ${{ inputs.stage != 'triage' && inputs.stage != 'backfill' }}   # a scheduled run has no inputs, so it runs this
        run: python3 -m steelframe.pipeline.daily
        continue-on-error: true   # exit 1 means something was held or deferred: still save and publish what finished
      - name: Triage only
        id: triage
        if: ${{ inputs.stage == 'triage' }}
        env:
          LIMIT: ${{ inputs.limit }}
        run: python3 -m steelframe.pipeline.triage --limit "$LIMIT"
        continue-on-error: true   # exit 1 means a batch failed: still save what was scored
      - name: Backfill
        id: backfill
        if: ${{ inputs.stage == 'backfill' }}
        env:
          COUNT: ${{ inputs.count }}
        run: python3 -m steelframe.pipeline.backfill --count "$COUNT"
        continue-on-error: true   # exit 1 means something was held or deferred: still save and publish what finished
      - name: Audit
        id: audit
        if: ${{ inputs.stage != 'triage' }}
        run: python3 -m steelframe.ops.audit run
        continue-on-error: true
      - name: Build the site
        if: ${{ inputs.stage != 'triage' }}
        run: python3 -m steelframe.site.build
      - name: Save the database to the state branch
        run: |
          git config user.name "steelframe-bot"
          git config user.email "noreply@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin state >/dev/null 2>&1; then
            git fetch origin state:state
            git worktree add /tmp/state state
          else
            git worktree add --orphan -b state /tmp/state
          fi
          cp data/raw/scout.sqlite /tmp/state/scout.sqlite
          cp data/raw/quota.sqlite /tmp/state/quota.sqlite 2>/dev/null || true
          cd /tmp/state
          git add -A
          git commit -m "state $(date -u +%F)" || echo "no change to save"
          git push origin state
      - uses: actions/upload-pages-artifact@v3
        if: ${{ inputs.stage != 'triage' }}
        with:
          path: site/dist
      - uses: actions/deploy-pages@v4
        if: ${{ inputs.stage != 'triage' }}
      - name: Fail the job if the run needs attention
        if: ${{ steps.daily.outcome == 'failure' || steps.triage.outcome == 'failure' || steps.backfill.outcome == 'failure' || steps.audit.outcome == 'failure' }}
        run: |
          echo "The daily run or the audit exited non-zero: something was held, deferred, failed or the alarm is on. Read the logs above." >&2
          exit 1
